<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시글 목록</title>
</head>
<body>

<h1>게시글 목록</h1>

<!-- 🔍 검색 폼 -->
<form method="GET" action="{% url 'post:home' %}">
    <input type="text" name="q" placeholder="검색어 입력 (띄어쓰기/쉼표)" value="{{ request.GET.q }}">
    
    <select name="filter">
        <option value="all" {% if request.GET.filter == 'all' or not request.GET.filter %}selected{% endif %}>전체</option>
        <option value="title" {% if request.GET.filter == 'title' %}selected{% endif %}>제목</option>
        <option value="content" {% if request.GET.filter == 'content' %}selected{% endif %}>내용</option>
    </select>

    <button type="submit">검색</button>
</form>
<!-- ✅ 검색 폼 끝 -->

<!-- 📋 게시글 목록 -->
<ul>
    {% for post in posts %}
        <li><a href="{% url 'post:detail' post.id %}">{{ post.title }}</a></li>
    {% empty %}
        <li>검색 결과가 없습니다.</li>
    {% endfor %}
</ul>

<!-- ✏️ 글쓰기 버튼 -->
<a href="{% url 'post:write' %}">글 작성하기</a>

<!-- 👤 로그인 상태에 따라 메뉴 -->
{% if user.is_authenticated %}
    <p>{{ user.username }}님 환영합니다! <a href="{% url 'user:logout' %}">로그아웃</a></p>
{% else %}
    <a href="{% url 'user:login' %}">로그인</a> | <a href="{% url 'user:signup' %}">회원가입</a>
{% endif %}

</body>
</html>
